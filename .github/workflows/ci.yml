# CI 占位：推送到 GitHub 后自动跑 lint + test。本地无 remote 时不会触发。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: npm install
      - name: Lint
        run: npm run lint
      - name: 测试
        run: npm test
      - name: 构建后端
        run: npm run build
      - name: CLI 依赖
        run: npm --prefix cli install
      - name: CLI 类型检查
        run: npm --prefix cli run typecheck
      - name: CLI 测试
        run: npm --prefix cli run test
